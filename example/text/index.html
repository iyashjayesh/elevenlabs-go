<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElevenLabs Agent Chat DEMO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #121212;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: thin;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.agent {
            align-self: flex-start;
            background: #2a2a2a;
            color: #ffffff;
        }

        .message.user {
            align-self: flex-end;
            background: #ffffff;
            color: #000000;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .chat-input {
            padding: 20px;
            background: rgba(0, 0, 0, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex-grow: 1;
            padding: 15px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .chat-input input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .chat-input button {
            background: white;
            color: #000000;
            border: none;
            border-radius: 25px;
            padding: 0 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .chat-input button:active {
            transform: translateY(0);
        }

        .status {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .latency-indicator {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #a0aec0;
        }

        .message-meta {
            font-size: 0.7rem;
            color: #888;
            margin-top: 5px;
            text-align: right;
            font-family: monospace;
        }

        .typing-indicator {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.6);
            padding: 12px 18px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: none;
            gap: 4px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #666;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="chat-header">
            <div>ElevenLabs Agent DEMO</div>
            <div class="status">
                <span id="latency" class="latency-indicator" style="display: none;"></span>
                <span id="statusText">Connecting to server...</span>
            </div>
        </div>

        <div class="chat-messages" id="messages">
            <!-- Messages will appear here -->
            <div class="typing-indicator" id="typing">
                <span></span><span></span><span></span>
            </div>
        </div>

        <div class="chat-input">
            <input type="text" id="msgInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusTextEl = document.getElementById('statusText');
        const latencyEl = document.getElementById('latency');
        const typingEl = document.getElementById('typing');

        // Connect to local WebSocket
        const ws = new WebSocket(`ws://${window.location.host}/ws`);

        ws.onopen = () => {
            statusTextEl.innerText = "Connected to Agent";
            statusTextEl.style.color = "#4ade80";
        };

        ws.onclose = () => {
            statusTextEl.innerText = "Disconnected from server";
            statusTextEl.style.color = "#f87171";
            latencyEl.style.display = "none";
        };

        ws.onerror = (err) => {
            console.error("WS Error:", err);
        };

        let currentLatency = "";

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "agent_response") {
                appendMessage(data.text, "agent");
                hideTyping();
            } else if (data.type === "agent_typing") {
                showTyping();
            } else if (data.type === "user_transcript") {
                appendMessage(data.text, "user");
            } else if (data.type === "latency") {
                latencyEl.style.display = "inline-block";
                latencyEl.innerText = data.text;
                currentLatency = data.text;
            }
        };

        function showTyping() {
            typingEl.style.display = "flex";
            messagesEl.appendChild(typingEl); // Move to bottom
            scrollToBottom();
        }

        function hideTyping() {
            typingEl.style.display = "none";
        }

        function appendMessage(text, sender) {
            const el = document.createElement('div');
            el.className = `message ${sender}`;

            const textEl = document.createElement('div');
            textEl.innerText = text;
            el.appendChild(textEl);

            if (sender === "agent" && currentLatency) {
                const metaEl = document.createElement('div');
                metaEl.className = 'message-meta';
                metaEl.innerText = `Latency: ${currentLatency}`;
                el.appendChild(metaEl);
            }

            // Insert before typing indicator
            messagesEl.insertBefore(el, typingEl);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            // Optimistically show user message
            appendMessage(text, "user");

            // Send to server
            ws.send(JSON.stringify({ type: "user_message", text: text }));

            msgInput.value = "";
            showTyping(); // Simulate waiting for agent
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

    </script>

</body>

</html>
